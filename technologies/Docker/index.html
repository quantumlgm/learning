<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx Volume Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            padding: 50px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
            max-width: 700px;
            width: 90%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .status {
            display: inline-block;
            background: #22c55e;
            color: #fff;
            padding: 10px 22px;
            border-radius: 999px;
            font-weight: bold;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #e5e7eb;
        }

        .footer {
            margin-top: 35px;
            font-size: .9rem;
            opacity: .8;
        }

        .time {
            margin-top: 20px;
            font-size: 1.3rem;
            color: #93c5fd;
            font-weight: bold;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 Nginx Volume Test</h1>

    <div class="status">
        ✔ Nginx работает
    </div>

    <p>
        Если вы видите эту страницу — контейнер успешно отдает HTML-файл.
    </p>

    <p style="margin-top:15px;">
        Попробуйте изменить этот файл на хосте. Если страница обновится после F5 —
        значит Docker Volume подключен правильно.
    </p>

    <div class="time" id="time"></div>

    <div class="footer">
        Docker • Nginx • Volumes • HTML5
    </div>
</div>

<script>
function updateTime() {
    document.getElementById("time").textContent =
        "Текущее время: " + new Date().toLocaleString();
}

updateTime();
setInterval(updateTime, 1000);
</script>

</body>
</html>
